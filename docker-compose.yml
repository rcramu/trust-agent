services:
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: trustagent-results-ui:local
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
