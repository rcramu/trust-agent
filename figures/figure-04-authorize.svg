<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Figure 4. TrustAgentAuthorize decision flow">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1b4d6e"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="40" y="20" width="200" height="44" fill="#fffdf8" stroke="#1b4d6e" stroke-width="1.4"/>
<text x="140.0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c2328">Planner proposes</text>
<text x="140.0" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5f7c8a">invoke tool X</text>
<line x1="240" y1="42" x2="300" y2="42" stroke="#1b4d6e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="300" y="16" width="240" height="280" fill="#e8eef2" stroke="#1b4d6e" stroke-width="1.4"/>
<text x="420" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c2328">TrustAgentAuthorize</text>
<text x="320" y="68" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c2328">1. Verify identity</text>
<text x="320" y="106" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c2328">2. Registry status</text>
<text x="320" y="144" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c2328">3. Validate credential</text>
<text x="320" y="182" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c2328">4. Validate capability</text>
<text x="320" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c2328">5. Validate resource</text>
<text x="320" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c2328">6. Compute ATS</text>
<line x1="540" y1="80" x2="600" y2="80" stroke="#1b4d6e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="600" y="56" width="140" height="48" fill="#fffdf8" stroke="#1b4d6e" stroke-width="1.4"/>
<text x="670.0" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c2328">DENY</text>
<text x="670.0" y="94" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5f7c8a">any hard fail</text>
<line x1="540" y1="250" x2="600" y2="250" stroke="#1b4d6e" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="600" y="140" width="140" height="40" fill="#e8eef2" stroke="#1b4d6e" stroke-width="1.4"/>
<text x="670.0" y="164.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c2328">Allow ≥90</text>
<rect x="600" y="188" width="140" height="40" fill="#fffdf8" stroke="#1b4d6e" stroke-width="1.4"/>
<text x="670.0" y="212.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c2328">Restrict ≥75</text>
<rect x="600" y="236" width="140" height="40" fill="#fffdf8" stroke="#1b4d6e" stroke-width="1.4"/>
<text x="670.0" y="260.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c2328">Verify ≥60</text>
<rect x="600" y="284" width="140" height="40" fill="#fffdf8" stroke="#1b4d6e" stroke-width="1.4"/>
<text x="670.0" y="308.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c2328">Approve ≥40</text>
<rect x="600" y="332" width="140" height="40" fill="#fffdf8" stroke="#1b4d6e" stroke-width="1.4"/>
<text x="670.0" y="356.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1c2328">Deny &lt;40</text>
</svg>
